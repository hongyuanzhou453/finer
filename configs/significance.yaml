# 统计效力门阈值（CRD-2）—— 文件即真值，改阈值 = 改本文件
#
# 回答 spec 空白：「n 多大才允许把一个分数呈现给用户」。
# 这是硬门，不是软提示：CRD-1 记录卡强制调用，前端强制消费。
#
# 契约见 docs/specs/2026-08-02-positioning-pivot-proposal.md §3.3。

version: 1

# ─────────────────────────────────────────────────────────────────────
# 样本充分性分档（按已结算条数）
# ─────────────────────────────────────────────────────────────────────
# 阈值依据：n=30 时二项比例的 Wilson 半宽约 ±17pp（p≈0.45），已足以区分
# 「明显偏离基线」与「贴着基线」；n=15 时半宽约 ±24pp，只够当参考。
# 低于 15 连点估计都不该显示，只显示计数。
tiers:
  sufficient:
    min_settled: 30
    display_policy: show
  provisional:
    min_settled: 15
    display_policy: show_with_warning
  # 其余一律 insufficient / count_only

# 置信区间口径
confidence: 0.95

# ─────────────────────────────────────────────────────────────────────
# 结算覆盖率（防幸存者偏差）
# ─────────────────────────────────────────────────────────────────────
# settled/total 过低意味着「能结算的那部分」可能系统性不同于全体
# （例如取不到价的小盘股被整体排除）。低于阈值强制降一档并附声明。
coverage:
  min_ratio: 0.5

# ─────────────────────────────────────────────────────────────────────
# 预测性主张许可 —— 由检验的**记录结果**驱动，不是配置口味
# ─────────────────────────────────────────────────────────────────────
# 关键区分：样本充分 ≠ 可以做预测性主张。这是两道独立的门。
# 瑞银 n=435 的历史超额估得很准，但它不能预测未来超额 —— 前者是估计精度
# 问题，后者是跨期持续性问题。任何「按历史分挑信源」的呈现都必须过这道门。
#
# permitted 只能由一次通过预声明判据的持续性检验来翻为 true，
# 不得因「看起来合理」或「业务需要」手改。
predictive_claim:
  broker_excess_win_rate:
    permitted: false
    tested_at: "2026-08-02"
    sample_size: 2889
    evidence: "docs/specs/2026-07-30-credibility-persistence-test.md 附录 B"
    summary: >-
      遍历 6 个切分点：超额胜率 2 正/4 负、中位 |z|=0.32；
      超额均值收益 1 正/5 负、中位 |t|=1.20。预声明判据（同号且中位>1.5）双双不成立。
    scope_note: >-
      结论适用于券商层级、月度切分、每段 n>=30。不适用于分析师个人层级、
      行业层级，也未在 KOL 上检验（样本不足）。

  kol_excess_win_rate:
    permitted: false
    tested_at: null
    sample_size: null
    evidence: null
    summary: "尚未检验 —— 未检验一律按不许可处理，不得默认成立。"
    scope_note: null

  consensus_direction:
    permitted: false
    tested_at: null
    sample_size: null
    evidence: null
    summary: >-
      EXT-2 共识版策略的前提假设，尚未检验。上线前须过与券商检验同规格的门
      （判据先声明、遍历全部参数点、胜率与均值收益两个口径同时成立）。
    scope_note: null
